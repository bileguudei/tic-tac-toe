<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="tictactoe.css" />
  </head>
  <body>
    <section id="main">
      <div class="board">
        <div class="score-con">
          <div id="playerX" class="score">
            <h3>Player X</h3>
            <h2 id="playerX-Score">0</h2>
          </div>
          <div id="draw" class="score">
            <h3>Draw</h3>
            <h2 id="draw-Score">0</h2>
          </div>
          <div id="playerO" class="score">
            <h3>Player O</h3>
            <h2 id="playerO-Score">0</h2>
          </div>
        </div>

        <div class="square-con">
          <div class="square"></div>
          <div class="square"></div>
          <div class="square"></div>
          <div class="square"></div>
          <div class="square"></div>
          <div class="square"></div>
          <div class="square"></div>
          <div class="square"></div>
          <div class="square"></div>
        </div>
      </div>
    </section>

    <script src="tictactoe.js"></script>
  </body>
</html>
